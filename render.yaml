services:
  # PostgreSQL Database
  - type: pgsql
    name: convertflow-db
    plan: free
    databaseName: convertflow
    user: convertflow

  # Redis
  - type: redis
    name: convertflow-redis
    plan: free
    ipAllowList: []

  # Backend API
  - type: web
    name: convertflow-api
    runtime: image
    image:
      url: https://github.com/ThiagoVieira04/ConvertPlay.git
      branch: main
      dockerfilePath: docker/Dockerfile.api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: convertflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: convertflow-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGIN
        value: https://convert-play-frontend.vercel.app
      - key: RATE_LIMIT_MAX
        value: 30
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: REQUEST_TIMEOUT_MS
        value: 30000
      - key: MAX_URL_LENGTH
        value: 2048
      - key: MAX_ITEMS_PER_JOB
        value: 50
      - key: JOB_TTL_HOURS
        value: 72
    healthCheckPath: /api/health/live
    autoDeploy: true

  # Worker (BullMQ + FFmpeg)
  - type: worker
    name: convertflow-worker
    runtime: image
    image:
      url: https://github.com/ThiagoVieira04/ConvertPlay.git
      branch: main
      dockerfilePath: docker/Dockerfile.worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: convertflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: convertflow-redis
          type: redis
          property: connectionString
      - key: MAX_CONCURRENT_JOBS
        value: 2
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFMPEG_TIMEOUT_MS
        value: 300000
      - key: STORAGE_DIR
        value: /tmp/storage
      - key: MAX_FILE_SIZE_MB
        value: 500
      - key: JOB_TTL_HOURS
        value: 72
      - key: TEMP_FILE_TTL_HOURS
        value: 48
    autoDeploy: true
